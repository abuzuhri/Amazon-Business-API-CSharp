name: Release

on:
  push:
    tags:
    - 'v*.*.*'
    - 'v*.*.*-rc*'
    - '[0-9]+.[0-9]+.[0-9]+'
    - '[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

env:
  LIB_PROJECT: Source/CSharpAmazonBusinessAPI/CSharpAmazonBusinessAPI.csproj

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ${{ env.LIB_PROJECT }}

    - name: Build
      run: dotnet build ${{ env.LIB_PROJECT }} --configuration Release --no-restore

    - name: Pack
      run: dotnet pack ${{ env.LIB_PROJECT }} --configuration Release --no-build

    - name: Push to NuGet
      run: dotnet nuget push "**/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_TOKEN }} --skip-duplicate

    - name: Get tag
      id: tag
      uses: dawidd6/action-get-tag@v1

    - name: Create Release
      id: create_release
      uses: actions/create-release@latest
      env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB_AMAZON_Business_API }}
      with:
          tag_name: ${{steps.tag.outputs.tag}}
          release_name: Release ${{steps.tag.outputs.tag}}
          body: TODO
          draft: false
          prerelease: false
